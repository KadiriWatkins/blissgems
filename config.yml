# BlissGems Configuration File
# Version 1.0.0

# ==========================================
# ENERGY SYSTEM
# ==========================================
energy:
  gain-on-kill: 1
  loss-on-death: 1
  max-energy: 10
  starting-energy: 10
  ruined-threshold: 1
  broken-threshold: 0

# ==========================================
# GEM SETTINGS
# ==========================================
gems:
  enabled:
    astra: true
    auratus: true
    fire: true
    flux: true
    heretic: true
    life: true
    puff: true
    speed: true
    strength: true
    wealth: true

  single-gem-only: true
  prevent-drop: true

# ==========================================
# REVIVE BEACON SETTINGS
# ==========================================
revive-beacon:
  duration: 300
  range: 10.0
  revive-health: 10.0
  restore-energy: 3

# ==========================================
# PASSIVE EFFECTS
# ==========================================
passives:
  update-interval: 20

  astra:
    phase-chance: 0.15

  auratus:
    divine-purity:
      enabled: true
    angels-grasp:
      mode: pull           # "pull" or "durability"
      pull-chance: 0.05
      pull-radius: 4.0
    feathered-fall:
      reduction: 0.7       # 70% fall damage reduction
    hauling-strike:
      shield-cd-extension: 40

  heretic:
    auto-crit:
      multiplier: 1.5
    hemorrhage:
      max-duration-ticks: 9600  # 8 minutes

  life:
    heal-amount: 0.5
    heal-interval: 100
    undead-damage-multiplier: 3.0
    saturation-multiplier: 2.0

  flux:
    flow-state-speed-boost: 0.2

  puff:
    double-jump-enabled: true

  speed:
    soul-sand-immunity: true

# ==========================================
# ABILITIES
# ==========================================
abilities:
  global-cooldown: 1

  cooldowns:
    astra-daggers: 20
    astra-projection: 60
    auratus-venerated-perforators: 12
    auratus-echoing-aegis: 18
    fire-fireball: 90
    fire-campfire: 120
    flux-ground: 90
    flux-ray: 120
    flux-shocking-arrows: 8
    heretic-bloodsaws: 8
    heretic-bloodlinking: 25
    life-heart-drainer: 45
    life-circle-of-life: 90
    puff-dash: 8
    puff-breezy-bash: 15
    speed-sedative: 50
    speed-storm: 60
    speed-terminal: 45
    speed-blur: 15
    strength-nullify: 30
    strength-frailer: 45
    strength-shadow-stalker: 120
    wealth-durability-chip: 40
    wealth-pockets: 0
    wealth-unfortunate: 60
    wealth-rich-rush: 540
    wealth-amplification: 180

  damage:
    astra-daggers: 4.0
    fire-fireball: 6.0
    fire-campfire: 2.0
    flux-shocking: 3.0
    life-drainer: 4.0
    puff-dash: 2.0
    strength-chad-bonus: 7.0

  fire-campfire:
    radius: 5.0
    burn-duration: 3

  durations:
    flux-ground-freeze: 5
    flux-ray: 8
    astra-projection: 10
    fire-campfire: 60
    life-drainer: 20
    life-circle: 10
    wealth-unfortunate: 40
    wealth-rich-rush: 120
    wealth-amplification: 45

  astra-projection:
    radius: 150.0

  # Auratus ability settings
  auratus-venerated-perforators:
    chain-speed: 2.0
    slam-radius: 5.0
    slam-damage: 6.0
    wind-disable-radius: 3.0

  auratus-echoing-aegis:
    parry-ticks: 12
    weapon-drain: 15
    heal-min: 4.0
    heal-max: 6.0
    speed-duration-ticks: 80
    weaving-duration-ticks: 60

  # Heretic ability settings
  heretic-bloodsaws:
    pass-through-damage: 3.0
    spore-radius: 5.0
    spore-duration-ticks: 100
    bleed-amplifier: 1.35

  heretic-bloodlinking:
    leap-velocity: 1.6
    slam-velocity: -2.8
    apex-ticks: 14
    aoe-radius: 4.0
    impact-damage: 5.0
    link-duration-ticks: 200
    mirror-ratio: 0.75

  # Flux conduction settings
  flux-conduction:
    range: 10

# ==========================================
# AUTO-ENCHANTING (TIER 2 ONLY)
# ==========================================
auto-enchant:
  enabled: true
  fire:
    flame: true
    fire-aspect: true
  puff:
    power: true
    punch: true
    feather-falling: true
  speed:
    efficiency: true
  strength:
    sharpness: true
  wealth:
    fortune: true
    looting: true
    mending: true

# ==========================================
# UPGRADER SYSTEM
# ==========================================
upgrader:
  play-effects: true
  particle: ENCHANT
  particle-count: 50
  sound: ENTITY_PLAYER_LEVELUP
  sound-volume: 1.0
  sound-pitch: 1.5

# ==========================================
# TRADER SYSTEM
# ==========================================
trader:
  cooldown: 5
  play-effects: true
  particle: PORTAL
  particle-count: 30
  sound: ENTITY_ENDERMAN_TELEPORT

# ==========================================
# ENERGY BOTTLE
# ==========================================
energy-bottle:
  drop-enabled: true
  play-effects: true
  particle: HEART
  particle-count: 20
  sound: ENTITY_EXPERIENCE_ORB_PICKUP

# ==========================================
# REPAIR KIT / PEDESTAL
# ==========================================
repair-kit:
  energy-per-second: 10
  max-total-energy: 10
  heal-radius: 10
  update-interval: 20
  prioritize-lowest: true
  play-effects: true
  particle: HAPPY_VILLAGER
  particle-count: 5

# ==========================================
# MESSAGES
# ==========================================
